name: Foundation quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: iranti_test
      DB_USERNAME: postgres
      DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_CACHE_HOST: 127.0.0.1
      REDIS_CACHE_PORT: "6380"
      IRANTI_INFRA_TESTS: "1"
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: iranti_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis-queue:
        image: redis:8.2.9
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis-cache:
        image: redis:8.2.9
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, mbstring, intl, bcmath, fileinfo, pcntl, gd
          tools: composer:2
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate --no-interaction
      - run: php artisan migrate --force --no-interaction
      - run: composer validate --strict
      - run: composer lint
      - run: composer analyse
      - run: composer test
      - run: composer audit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --strict-peer-deps --no-fund
      - run: npm run format:check
      - name: Approved temporary ESLint exception
        run: |
          echo "::warning::ESLint 9.39.5 is an approved EOL compatibility exception. ADR-010 requires review on official ecosystem support or before production."
          node -e "if (require('eslint/package.json').version !== '9.39.5') process.exit(1)"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production dependency audit (blocking)
        run: npm audit --omit=dev
      - name: Full audit with narrowly tracked dev-tooling exception
        run: node ../scripts/check-frontend-audit.mjs
      - name: Confirm affected dev tools are absent from runtime bundle
        run: |
          for package in braces micromatch fast-glob '@next/eslint-plugin-next' eslint-config-next; do
            if find .next/standalone -path "*/node_modules/$package" -print -quit | grep -q .; then
              echo "Unexpected runtime package: $package" >&2
              exit 1
            fi
          done
  render-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: iranti_container_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build production image
        run: docker build --pull -f Dockerfile.render -t iranti-render:ci .
      - name: Check paid and Free-test production profiles inside the image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint php iranti-render:ci -r 'require "/app/backend/vendor/autoload.php"; exit(class_exists(\Resend\Client::class) ? 0 : 1);'
          app_key="base64:$(openssl rand -base64 32)"
          fixture_resend_key="re_$(printf '%024d' 0)"
          common=(
            --rm --entrypoint php
            -e APP_ENV=production -e APP_DEBUG=false -e "APP_KEY=$app_key"
            -e APP_URL=https://free.example.test -e FRONTEND_URL=https://free.example.test
            -e TRUSTED_ORIGINS=https://free.example.test -e CATALOG_MEDIA_ORIGIN=https://free.example.test
            -e CATALOG_INTERNAL_READ_KEY=0123456789abcdef0123456789abcdef
            -e RENDER=true -e RENDER_SERVICE_ID=srv-synthetic-ci
            -e PRODUCTION_NETWORK_PROFILE=render-private-database
            -e DB_CONNECTION=pgsql -e DB_SSLMODE=require -e DB_URL=postgresql://test@db.internal/test
            -e QUEUE_CONNECTION=database -e CACHE_STORE=database -e RATE_LIMIT_CACHE_STORE=database
            -e DB_QUEUE_RETRY_AFTER=90 -e SESSION_DRIVER=database -e SESSION_ENCRYPT=true
            -e SESSION_SECURE_COOKIE=true -e SESSION_HTTP_ONLY=true -e SESSION_SAME_SITE=lax
            -e PRELAUNCH_GATE_ENABLED=true -e PAYSTACK_MODE=test -e PAYSTACK_LIVE_APPROVED=false
            -e PAYSTACK_REFUNDS_LIVE_APPROVED=false
            -e MAIL_MAILER=resend -e "RESEND_API_KEY=$fixture_resend_key"
            -e MAIL_FROM_ADDRESS=sender@ci-fixture.test -e 'MAIL_FROM_NAME=IRANTI Africa'
            -e CATALOG_UPLOAD_TRANSPORT=proxy
          )
          free=(
            -e IRANTI_DEPLOYMENT_PROFILE=render-free-test
            -e RENDER_CPU_COUNT=0.15
            -e CATALOG_DISK=render_free_private -e FILESYSTEM_DISK=render_free_private
          )
          paid=(
            -e IRANTI_DEPLOYMENT_PROFILE=render-private
            -e RENDER_CPU_COUNT=1
            -e CATALOG_DISK=s3 -e FILESYSTEM_DISK=s3
            -e AWS_ENDPOINT=https://storage.example.test -e AWS_BUCKET=synthetic-private-bucket
            -e AWS_ACCESS_KEY_ID=synthetic-key -e AWS_SECRET_ACCESS_KEY=synthetic-secret
          )
          docker run "${common[@]}" "${free[@]}" iranti-render:ci /app/backend/artisan --version
          docker run "${common[@]}" -e IRANTI_DEPLOYMENT_PROFILE=render-free-test \
            -e RENDER_CPU_COUNT=0.1 -e CATALOG_DISK=render_free_private -e FILESYSTEM_DISK=render_free_private \
            iranti-render:ci /app/backend/artisan --version
          docker run "${common[@]}" "${paid[@]}" iranti-render:ci /app/backend/artisan --version
          if docker run "${common[@]}" -e IRANTI_DEPLOYMENT_PROFILE=render-free-tset \
            -e CATALOG_DISK=render_free_private -e FILESYSTEM_DISK=render_free_private \
            iranti-render:ci /app/backend/artisan --version; then
            echo 'Unknown production deployment profile was accepted.' >&2
            exit 1
          fi
          if docker run "${common[@]}" -e IRANTI_DEPLOYMENT_PROFILE=render-private \
            -e CATALOG_DISK=s3 -e FILESYSTEM_DISK=s3 \
            iranti-render:ci /app/backend/artisan --version; then
            echo 'Paid production accepted missing private S3 configuration.' >&2
            exit 1
          fi
          if docker run "${common[@]}" -e IRANTI_DEPLOYMENT_PROFILE=render-free-test \
            -e RENDER_CPU_COUNT=1 -e CATALOG_DISK=render_free_private -e FILESYSTEM_DISK=render_free_private \
            iranti-render:ci /app/backend/artisan --version; then
            echo 'Paid compute accepted the ephemeral Free-test media profile.' >&2
            exit 1
          fi
      - name: Boot and inspect production image with isolated test configuration
        env:
          TEST_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          app_key="base64:$(openssl rand -base64 32)"
          runtime=(
            --network host
            --memory 2g --cpus 1
            -e APP_ENV=testing -e APP_DEBUG=false -e "APP_KEY=$app_key"
            -e DB_CONNECTION=pgsql -e DB_HOST=127.0.0.1 -e DB_PORT=5432
            -e DB_DATABASE=iranti_container_test -e DB_USERNAME=postgres
            -e "DB_PASSWORD=$TEST_DB_PASSWORD" -e DB_SSLMODE=disable
            -e CACHE_STORE=database -e QUEUE_CONNECTION=database
            -e SESSION_DRIVER=database -e MAIL_MAILER=array
            -e PRELAUNCH_GATE_ENABLED=false -e PORT=10000
          )
          docker run --rm "${runtime[@]}" iranti-render:ci migrate
          container_id="$(docker run -d --rm "${runtime[@]}" iranti-render:ci web)"
          trap 'docker stop --time 120 "$container_id" >/dev/null 2>&1 || true' EXIT
          ready=false
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:10000/api/v1/health >/dev/null &&
              curl --fail --silent http://127.0.0.1:10000/ >/dev/null &&
              docker exec "$container_id" supervisorctl status | awk '
                $1 == "nginx" || $1 == "php-fpm" || $1 == "next" ||
                $1 == "queue" || $1 == "scheduler" {
                  count++
                  if ($2 != "RUNNING") exit 1
                }
                END { if (count != 5) exit 1 }
              '; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker exec "$container_id" supervisorctl status >&2 || true
            docker logs "$container_id" >&2
            exit 1
          fi
          docker exec "$container_id" supervisorctl status
          docker exec "$container_id" php -v | grep -q 'PHP 8.5'
          docker exec "$container_id" node --version | grep -q '^v24\.'
          for extension in pdo_pgsql gd intl mbstring bcmath exif pcntl zip 'Zend OPcache'; do
            docker exec "$container_id" php -m | grep -iq "^$extension$"
          done
          test "$(docker exec "$container_id" id -u)" = 33
          docker exec "$container_id" test -f /app/frontend/server.js
          docker exec "$container_id" test -w /app/backend/storage
          docker exec "$container_id" test -w /app/backend/storage/app/render-free-private
          docker exec "$container_id" test ! -e /app/backend/public/storage
          docker exec "$container_id" test ! -L /app/backend/public/storage
          docker exec "$container_id" nginx -t -c /tmp/iranti-nginx.conf
          for package in braces micromatch fast-glob '@next/eslint-plugin-next' eslint-config-next; do
            if docker exec "$container_id" find /app/frontend -path "*/node_modules/$package" -print -quit | grep -q .; then
              echo "Unexpected runtime package: $package" >&2
              exit 1
            fi
          done
          for process in nginx php-fpm next queue scheduler; do
            docker exec "$container_id" supervisorctl status "$process" | grep -q RUNNING
          done
          docker exec "$container_id" php /app/backend/artisan app:readiness
          curl --fail --silent http://127.0.0.1:10000/api/v1/health | grep -q '"ok"'
          docker stats --no-stream --format 'idle {{.MemUsage}} {{.CPUPerc}}' "$container_id"
          for path in / /products /checkout /admin; do
            curl --silent --output /dev/null --write-out "$path %{http_code} %{time_total}s\n" "http://127.0.0.1:10000$path"
          done
          docker stats --no-stream --format 'after requests {{.MemUsage}} {{.CPUPerc}}' "$container_id"
          for process in queue next php-fpm scheduler nginx; do
            old_pid="$(docker exec "$container_id" supervisorctl pid "$process")"
            docker exec "$container_id" sh -c 'kill -TERM "$1"' sh "$old_pid"
            restarted=false
            for attempt in {1..25}; do
              sleep 2
              new_pid="$(docker exec "$container_id" supervisorctl pid "$process" 2>/dev/null || true)"
              if [[ "$new_pid" =~ ^[1-9][0-9]*$ && "$new_pid" != "$old_pid" ]] &&
                docker exec "$container_id" supervisorctl status "$process" | grep -q RUNNING; then
                restarted=true
                break
              fi
            done
            if [[ "$restarted" != true ]]; then
              docker logs "$container_id" >&2
              exit 1
            fi
            echo "$process restarted under Supervisor"
          done
          docker stop --time 120 "$container_id"
          trap - EXIT
