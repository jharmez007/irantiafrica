name: Foundation quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: iranti_test
      DB_USERNAME: postgres
      DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_CACHE_HOST: 127.0.0.1
      REDIS_CACHE_PORT: "6380"
      IRANTI_INFRA_TESTS: "1"
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: iranti_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis-queue:
        image: redis:8.2.9
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis-cache:
        image: redis:8.2.9
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, mbstring, intl, bcmath, fileinfo, pcntl, gd
          tools: composer:2
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate --no-interaction
      - run: composer validate --strict
      - run: composer lint
      - run: composer analyse
      - run: composer test
      - run: composer audit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --strict-peer-deps --no-fund
      - run: npm run format:check
      - name: Approved temporary ESLint exception
        run: |
          echo "::warning::ESLint 9.39.5 is an approved EOL compatibility exception. ADR-010 requires review on official ecosystem support or before production."
          node -e "if (require('eslint/package.json').version !== '9.39.5') process.exit(1)"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit
