name: iranti-foundation
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Generate infrastructure/.env first}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Generate infrastructure/.env first}
      POSTGRES_TEST_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Generate infrastructure/.env first}
    ports: ["127.0.0.1:54320:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-iranti.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis-queue:
    image: redis:8.2.9
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:63790:6379"]
    volumes: ["redis-queue-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis-cache:
    image: redis:8.2.9
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:63791:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  redis-queue-data:
